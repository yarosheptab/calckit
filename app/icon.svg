<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#2563eb" rx="18"/>
  <!-- plus sign (top-left) -->
  <rect x="22" y="28" width="26" height="7" rx="3" fill="#fff"/>
  <rect x="32" y="18" width="7" height="26" rx="3" fill="#fff"/>
  <!-- equals sign (top-right) -->
  <rect x="52" y="28" width="26" height="7" rx="3" fill="#fff"/>
  <rect x="52" y="40" width="26" height="7" rx="3" fill="#fff"/>
  <!-- divider -->
  <rect x="18" y="56" width="64" height="2" rx="1" fill="#ffffff33"/>
  <!-- key grid (2 rows × 3 cols) -->
  <circle cx="30" cy="70" r="6" fill="#fff"/>
  <circle cx="50" cy="70" r="6" fill="#fff"/>
  <circle cx="70" cy="70" r="6" fill="#fff"/>
  <circle cx="30" cy="84" r="6" fill="#fff"/>
  <circle cx="50" cy="84" r="6" fill="#fff"/>
  <circle cx="70" cy="84" r="6" fill="#fff"/>
</svg>
