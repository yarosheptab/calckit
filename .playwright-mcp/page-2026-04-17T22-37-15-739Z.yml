      - generic [ref=e49]:
        - heading "Frequently Asked Questions" [level=2] [ref=e50]
        - generic [ref=e51]:
          - generic [ref=e52]:
            - heading "How often are exchange rates updated?" [level=3] [ref=e53]
            - paragraph [ref=e54]: Our rates are sourced from an open exchange-rate API and updated hourly. For real-time trading rates, use a dedicated forex platform. For everyday conversions — travel, transfers, purchases — hourly rates are more than accurate enough.
          - generic [ref=e55]:
            - heading "What is the mid-market exchange rate?" [level=3] [ref=e56]
            - paragraph [ref=e57]: The mid-market rate (also called the interbank rate) is the midpoint between the buy and sell prices in the global currency market. It's the "true" exchange rate you see on Google or financial data providers. Banks and services typically charge a margin above this rate.
          - generic [ref=e58]:
            - heading "Why do banks give worse rates than this calculator?" [level=3] [ref=e59]
            - paragraph [ref=e60]: Banks, airport kiosks, and transfer services add a markup (spread) on top of the mid-market rate — often 1–5%. That's how they profit on currency exchange. Services like Wise and Revolut are closer to the mid-market rate with a transparent fee, making them cheaper for international transfers.
          - generic [ref=e61]:
            - heading "Which currency is the strongest in the world?" [level=3] [ref=e62]
            - paragraph [ref=e63]: By nominal exchange rate, the Kuwaiti Dinar (KWD) is the highest-valued currency against the US Dollar (1 KWD ≈ $3.25 USD). However, "strong" doesn't mean better for an economy — exchange rates reflect supply, demand, monetary policy, and trade balances, not economic health alone.
          - generic [ref=e64]:
            - heading "What is the difference between a fixed and floating exchange rate?" [level=3] [ref=e65]
            - paragraph [ref=e66]: A floating exchange rate is determined by market supply and demand (USD, EUR, GBP). A fixed (pegged) rate is set and maintained by a government against another currency — for example, the Hong Kong Dollar is pegged to the USD at roughly 7.8:1. Fixed rates offer stability; floating rates adjust to economic conditions.
