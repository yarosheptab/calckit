          - generic [ref=e68]:
            - heading "What is the monthly payment on a $400,000 mortgage?" [level=3] [ref=e69]
            - paragraph [ref=e70]: At 6.5% interest over 30 years with a 20% down payment ($80,000), your loan is $320,000 and the monthly principal & interest payment is approximately $2,023. Property taxes, insurance, and PMI will increase your total monthly cost.
          - generic [ref=e71]:
            - heading "How is a mortgage payment calculated?" [level=3] [ref=e72]
            - paragraph [ref=e73]: The formula is M = P × [r(1+r)^n] / [(1+r)^n − 1], where P is the loan amount, r is the monthly interest rate (annual rate ÷ 12), and n is the total number of payments (years × 12). This gives the fixed monthly principal + interest payment.
          - generic [ref=e74]:
            - heading "How much house can I afford?" [level=3] [ref=e75]
            - paragraph [ref=e76]: "A common guideline is the 28/36 rule: your monthly mortgage payment should not exceed 28% of gross monthly income, and total debt payments should not exceed 36%. For a $100,000 annual salary, that means a mortgage payment under ~$2,333/month."
          - generic [ref=e77]:
            - heading "What is the difference between interest rate and APR?" [level=3] [ref=e78]
            - paragraph [ref=e79]: The interest rate is the base cost of borrowing the principal. APR (Annual Percentage Rate) includes the interest rate plus lender fees, points, and mortgage insurance — making it a more complete measure of the loan's true annual cost. APR is always equal to or higher than the interest rate.
          - generic [ref=e80]:
            - heading "How much of my mortgage payment goes to interest vs principal?" [level=3] [ref=e81]
            - paragraph [ref=e82]: "In the early years, most of your payment goes to interest. On a 30-year $300,000 loan at 6.5%, your first payment splits roughly $1,625 to interest and $271 to principal. Over time this flips: by year 25, most of each payment is principal. The amortization schedule shows this breakdown month by month."
